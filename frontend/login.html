<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in - Squat Optimizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <nav class="nav">
        <a href="index.html" class="nav-logo" style="text-decoration:none">SQUAT<span class="accent">OPT</span></a>
        <div class="nav-links">
            <a href="register.html" class="btn btn-accent btn-sm" style="padding:0.5rem 1.2rem;font-size:0.85rem">Sign Up</a>
        </div>
    </nav>

    <div class="form-page">
        <div class="form-container">
            <h2>Log in</h2>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>
            <form id="register-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Your password" required>
                </div>

                <button type="submit" class="btn btn-accent form-submit">
                    Log in
                </button>
            </form>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="color: var(--text-muted)">Logging in...</p>
            </div>

            <div class="form-footer">
                Don't have an account? <a href="register.html">Sign up here</a>
            </div>
        </div>
    </div>
    <script src="js/login.js"></script>
</body>
</html>
