<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Squat Optimizer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800;900&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="noise-overlay"></div>

    <nav class="nav">
        <a href="index.html" class="nav-logo" style="text-decoration:none">SQUAT<span class="accent">OPT</span></a>
        <div class="nav-links">
            <a href="login.html" class="nav-link">Log in</a>
        </div>
    </nav>

    <div class="form-page">
        <div class="form-container">
            <h2>Create Account</h2>

            <div id="error-message" class="error-message"></div>
            <div id="success-message" class="success-message"></div>

            <form id="register-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" minlength="6" required>
                </div>

                <button type="submit" class="btn btn-accent form-submit">
                    Sign Up
                </button>
            </form>

            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p style="color: var(--text-muted)">Creating your account...</p>
            </div>

            <div class="form-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>
    <script src="js/register.js"></script>
</body>
</html>
